apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 60
commands:
  - script: |
      #!/bin/sh
      kubectl get svc elasti-target-deployment-pvt-9696239e87 --namespace=$NAMESPACE
      if [ "$?" = "0" ]; then exit 1; fi
  - script: |
      #!/bin/sh
      set -e
      replicas=$(kubectl get deployment target-deployment -n "$NAMESPACE" -o jsonpath='{.spec.replicas}')
      if [ "$replicas" != "1" ]; then
        echo "expected target-deployment replicas=1 after ElastiService delete, got: $replicas"
        exit 1
      fi
