name: E2E Tests with Kuttl

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'operator/**'
      - 'resolver/**'
      - 'pkg/**'
      - 'tests/e2e/**'
      - '*.go'
      - 'go.mod'
      - 'charts/**'

permissions:
  contents: read

jobs:
  kuttl-tests:
    name: Run Kuttl E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Install Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78 # v3.5
        with:
          version: 'v3.12.3'

      - name: Build and push images
        working-directory: ./tests/e2e
        run: |
          make build-images
      
      - name: Install Kind
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          install_only: true

      - name: Setup environment
        working-directory: ./tests/e2e
        run: |
          make setup

      - name: Install Kuttl
        run: |
          curl -Lo kuttl.tar.gz https://github.com/kudobuilder/kuttl/releases/download/v0.22.0/kuttl_0.22.0_linux_x86_64.tar.gz
          tar -xvf kuttl.tar.gz
          sudo mv kubectl-kuttl /usr/local/bin/
          kubectl kuttl version

      - name: Run E2E Tests
        working-directory: ./tests/e2e
        run: |
          make test
